[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "config-editor-app"
version = "0.1.0"
description = "Web editor and live preview for ePaperDash configurations"
requires-python = ">=3.12,<3.15"
dependencies = [
  "nicegui>=3.11.1,<4",
  "tomlkit>=0.14.0,<1",
  "epaper-dashboard-service",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["config_editor_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
